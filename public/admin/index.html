<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - WOLFKATANA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #e5e5e5; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #333; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 20px; color: #c9a96e; }
    .btn { padding: 8px 16px; border: none; cursor: pointer; font-size: 14px; border-radius: 4px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #c9a96e; color: #0a0a0a; font-weight: 600; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-secondary { background: #333; color: #e5e5e5; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }
    .login-box { max-width: 360px; margin: 120px auto; background: #141414; border: 1px solid #333; padding: 32px; border-radius: 8px; }
    .login-box h2 { margin-bottom: 20px; color: #c9a96e; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #999; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; background: #1a1a1a; border: 1px solid #333;
      color: #e5e5e5; border-radius: 4px; font-size: 14px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #c9a96e; }
    textarea { min-height: 80px; resize: vertical; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; }
    th { color: #c9a96e; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    td { color: #ccc; }
    .tag { display: inline-block; padding: 2px 8px; font-size: 11px; border-radius: 2px; font-weight: 500; }
    .tag-gold { background: #c9a96e; color: #0a0a0a; }
    .tag-crimson { background: #991b1b; color: #fff; }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
      justify-content: center; align-items: center; padding: 24px;
    }
    .modal.active { display: flex; }
    .modal-content { background: #141414; border: 1px solid #333; border-radius: 8px; width: 100%; max-width: 720px; max-height: 90vh; overflow-y: auto; padding: 24px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h3 { color: #c9a96e; }
    .close-btn { background: none; border: none; color: #999; font-size: 20px; cursor: pointer; }
    .actions { display: flex; gap: 8px; }
    .status { padding: 2px 8px; font-size: 11px; border-radius: 2px; }
    .status-in { background: #14532d; color: #86efac; }
    .status-out { background: #450a0a; color: #fca5a5; }
    .deploy-notice {
      background: #1e3a2f; border: 1px solid #2d5a3f; color: #86efac;
      padding: 12px 16px; border-radius: 4px; margin-bottom: 20px; display: none;
    }
    .deploy-notice.active { display: block; }
    .empty { text-align: center; padding: 60px; color: #666; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .error { background: #450a0a; color: #fca5a5; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; display: none; }
    .error.active { display: block; }
    .gallery-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .gallery-row input { flex: 1; }
    .gallery-row .img-type { width: 120px; }
    .gallery-row .img-preview { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; border: 1px solid #333; background: #1a1a1a; }
    .gallery-row .btn { padding: 6px 10px; font-size: 12px; }
    .add-img-btn { background: #1a3a2f; color: #86efac; border: 1px dashed #2d5a3f; width: 100%; padding: 10px; margin-top: 4px; cursor: pointer; border-radius: 4px; }
    .add-img-btn:hover { background: #1e4a3f; }
    .upload-btn { background: #1a3a2f; color: #86efac; border: 1px solid #2d5a3f; padding: 8px 12px; font-size: 12px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
    .upload-btn:hover { background: #1e4a3f; }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .upload-progress { font-size: 11px; color: #86efac; margin-left: 8px; }
    .upload-row { display: flex; align-items: center; gap: 8px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid #333; }
    .tab { padding: 10px 20px; font-size: 14px; cursor: pointer; color: #999; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab:hover { color: #ccc; }
    .tab.active { color: #c9a96e; border-bottom-color: #c9a96e; }
    .status-pending { background: #713f12; color: #fde047; }
    .status-confirmed { background: #1e3a8a; color: #93c5fd; }
    .status-shipped { background: #581c87; color: #d8b4fe; }
    .status-completed { background: #14532d; color: #86efac; }
    .status-cancelled { background: #450a0a; color: #fca5a5; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 14px; font-size: 13px; border-radius: 4px; background: #1a1a1a; border: 1px solid #333; color: #999; cursor: pointer; }
    .filter-btn:hover { border-color: #c9a96e; color: #ccc; }
    .filter-btn.active { background: #c9a96e; color: #0a0a0a; border-color: #c9a96e; font-weight: 600; }
    .config-section { background: #141414; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .config-section h3 { color: #c9a96e; font-size: 15px; margin-bottom: 16px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .toggle-label { font-size: 14px; color: #ccc; }
    .toggle { position: relative; width: 44px; height: 24px; background: #333; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
    .toggle.active { background: #c9a96e; }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
    .toggle.active::after { transform: translateX(20px); }
    .method-fields { margin-top: 12px; padding-left: 8px; border-left: 2px solid #333; }
    .order-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .order-detail-item { background: #1a1a1a; padding: 12px; border-radius: 4px; }
    .order-detail-item label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .order-detail-item div { font-size: 14px; color: #e5e5e5; }
    .order-items { background: #1a1a1a; padding: 12px; border-radius: 4px; margin-bottom: 16px; }
    .order-item-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; }
    .order-item-row:last-child { border-bottom: none; }
    .order-total { text-align: right; font-size: 16px; font-weight: 600; color: #c9a96e; margin-top: 8px; }
    .shipping-method-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
    .shipping-method-row input { flex: 1; }
    .shipping-method-row .btn { margin-bottom: 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const ADMIN_KEY = 'wolfkatana_admin_auth';
    const ADMIN_API_KEY = 'wolfkatana-admin-2024';
    const API_BASE = '/api/products';
    const ORDERS_API = '/api/orders';
    const SETTINGS_API = '/api/settings';

    function apiFetch(url, options = {}) {
      if (!options.headers) options.headers = {};
      options.headers['Authorization'] = 'Bearer ' + ADMIN_API_KEY;
      return fetch(url, options);
    }

    let products = [];
    let orders = [];
    let editingId = null;
    let activeTab = 'products';
    let settings = {};
    let orderStatusFilter = 'all';
    let currentOrder = null;

    function isLoggedIn() { return localStorage.getItem(ADMIN_KEY) === '1'; }
    function login() { localStorage.setItem(ADMIN_KEY, '1'); render(); }
    function logout() { localStorage.removeItem(ADMIN_KEY); render(); }

    async function fetchProducts() {
      const res = await apiFetch(API_BASE);
      products = await res.json();
      renderProductList();
    }

    async function fetchOrders() {
      const url = orderStatusFilter === 'all' ? ORDERS_API : `${ORDERS_API}?status=${orderStatusFilter}`;
      const res = await apiFetch(url);
      orders = await res.json();
      renderOrderList();
    }

    async function fetchSettings() {
      const res = await apiFetch(SETTINGS_API);
      settings = await res.json();
    }

    async function saveSettings(data) {
      const res = await apiFetch(SETTINGS_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      if (!res.ok) { const err = await res.json(); alert('保存失败: ' + (err.error || '未知错误')); return false; }
      await fetchSettings();
      return true;
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(el => {
        el.classList.toggle('active', el.getAttribute('onclick').includes("'" + tab + "'"));
      });
      loadTabContent(tab);
    }

    async function loadTabContent(tab) {
      if (tab === 'products') {
        renderProductsTab();
        await fetchProducts();
      } else if (tab === 'orders') {
        renderOrdersTab();
        await fetchOrders();
      } else if (tab === 'payment') {
        await fetchSettings();
        renderPaymentConfig();
      } else if (tab === 'shipping') {
        await fetchSettings();
        renderShippingConfig();
      } else if (tab === 'homepage') {
        await fetchSettings();
        renderHomepageConfig();
      } else if (tab === 'footer') {
        await fetchSettings();
        renderFooterConfig();
      } else if (tab === 'deploy') {
        await fetchSettings();
        renderDeployConfig();
      }
    }

    async function uploadFiles(input, onSuccessPerFile, onError) {
      const files = Array.from(input.files);
      if (files.length === 0) return;
      const btn = input.parentElement.querySelector('.upload-btn');
      const progress = input.parentElement.querySelector('.upload-progress');
      if (btn) btn.disabled = true;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (progress) progress.textContent = 'Uploading ' + (i + 1) + '/' + files.length + '...';
        const form = new FormData();
        form.append('file', file);
        form.append('prefix', input.dataset.prefix || 'products');
        try {
          const res = await apiFetch('/api/upload', { method: 'POST', body: form });
          const data = await res.json();
          if (data.success) {
            onSuccessPerFile(data.url, i);
          } else {
            throw new Error(data.error || 'Upload failed');
          }
        } catch (err) {
          if (progress) progress.textContent = 'Failed';
          if (onError) onError(err, i); else alert('Upload failed: ' + err.message);
        }
      }
      if (progress) progress.textContent = 'Done';
      if (btn) btn.disabled = false;
      input.value = '';
    }

    function getGalleryData() {
      const rows = document.querySelectorAll('.gallery-row');
      const gallery = [];
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input[type="text"]');
        const url = inputs[0]?.value.trim() || '';
        const type = row.querySelector('select')?.value || 'detail';
        const alt = inputs[1]?.value.trim() || '';
        if (url) gallery.push({ url, type, alt });
      });
      return gallery.length ? gallery : null;
    }

    async function saveProduct(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        name: form.name.value,
        category: form.category.value,
        price: parseInt(form.price.value),
        original_price: form.original_price.value ? parseInt(form.original_price.value) : null,
        rating: parseFloat(form.rating.value),
        reviews: parseInt(form.reviews.value),
        tag: form.tag.value || null,
        tag_color: form.tag_color.value || null,
        image: form.image.value,
        image_alt: form.image_alt.value || null,
        gallery: getGalleryData(),
        slug: form.slug.value,
        in_stock: form.in_stock.checked,
        description: form.description.value || null,
        blade_length: form.blade_length.value || null,
        overall_length: form.overall_length.value || null,
        weight: form.weight.value || null,
        material: form.material.value || null,
        handle: form.handle.value || null,
      };

      const url = editingId ? `${API_BASE}/${editingId}` : API_BASE;
      const method = editingId ? 'PUT' : 'POST';

      const res = await apiFetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      if (res.ok) { closeModal(); await fetchProducts(); showDeployNotice(); }
      else { const err = await res.json(); alert('保存失败: ' + (err.error || '未知错误')); }
    }

    async function deleteProduct(id) {
      if (!confirm('确定要删除这个商品吗？')) return;
      const res = await apiFetch(`${API_BASE}/${id}`, { method: 'DELETE' });
      if (res.ok) { await fetchProducts(); showDeployNotice(); } else { alert('删除失败'); }
    }

    function showDeployNotice() { document.getElementById('deployNotice')?.classList.add('active'); }

    function addGalleryRow(data = null) {
      const container = document.getElementById('galleryContainer');
      const div = document.createElement('div');
      div.className = 'gallery-row';
      const rowId = 'gallery-upload-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      div.innerHTML = `
        <img class="img-preview" src="${data?.url || ''}" onerror="this.style.display='none'" onload="this.style.display='block'">
        <input type="text" placeholder="图片 URL" value="${data?.url || ''}" oninput="this.parentElement.querySelector('.img-preview').src=this.value;this.parentElement.querySelector('.img-preview').style.display='block'" style="flex:1">
        <input type="file" accept="image/*" multiple style="display:none" id="${rowId}" onchange="uploadFiles(this, (url, idx) => { const row = this.closest('.gallery-row'); if (idx === 0) { row.querySelector('input[type=text]').value = url; row.querySelector('.img-preview').src = url; row.querySelector('.img-preview').style.display = 'block'; row.querySelector('.upload-progress').textContent = ''; } else { addGalleryRow({url: url, type: 'detail', alt: ''}); } })">
        <button type="button" class="upload-btn" onclick="document.getElementById('${rowId}').click()">Upload</button>
        <span class="upload-progress"></span>
        <select class="img-type">
          <option value="detail" ${data?.type==='detail'?'selected':''}>细节图</option>
          <option value="scene" ${data?.type==='scene'?'selected':''}>场景图</option>
          <option value="certificate" ${data?.type==='certificate'?'selected':''}>证书图</option>
          <option value="package" ${data?.type==='package'?'selected':''}>包装图</option>
        </select>
        <input type="text" placeholder="ALT 描述 (SEO)" value="${data?.alt || ''}" style="flex:0.8">
        <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">删除</button>
      `;
      container.appendChild(div);
    }

    function openModal(id = null) {
      editingId = id;
      const product = id ? products.find(p => p.id == id) : null;
      const modal = document.getElementById('modal');
      const form = document.getElementById('productForm');
      form.reset();
      document.getElementById('modalTitle').textContent = id ? '编辑商品' : '添加商品';
      document.getElementById('galleryContainer').innerHTML = '';

      if (product) {
        form.name.value = product.name || '';
        form.category.value = product.category || 'ANIME REPLICA';
        form.price.value = product.price || '';
        form.original_price.value = product.original_price || '';
        form.rating.value = product.rating || 5;
        form.reviews.value = product.reviews || 0;
        form.tag.value = product.tag || '';
        form.tag_color.value = product.tag_color || '';
        form.image.value = product.image || '/images/products/placeholder.jpg';
        form.image_alt.value = product.image_alt || '';
        form.slug.value = product.slug || '';
        form.in_stock.checked = product.in_stock === 1;
        form.description.value = product.description || '';
        form.blade_length.value = product.blade_length || '';
        form.overall_length.value = product.overall_length || '';
        form.weight.value = product.weight || '';
        form.material.value = product.material || '';
        form.handle.value = product.handle || '';
        if (product.gallery) {
          try {
            const g = typeof product.gallery === 'string' ? JSON.parse(product.gallery) : product.gallery;
            (Array.isArray(g) ? g : []).forEach(img => addGalleryRow(img));
          } catch(e) {}
        }
      } else {
        form.in_stock.checked = true;
        form.rating.value = 5;
        form.reviews.value = 0;
      }
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal')?.classList.remove('active');
      document.getElementById('orderModal')?.classList.remove('active');
      editingId = null;
      currentOrder = null;
    }

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="login-box">
          <h2>WOLFKATANA 管理后台</h2>
          <form id="loginForm">
            <div class="form-group"><label>密码</label><input type="password" id="password" placeholder="输入密码" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%">登录</button>
          </form>
          <p style="margin-top:16px;font-size:12px;color:#666;text-align:center;">默认密码: admin123</p>
        </div>`;
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (document.getElementById('password').value === 'admin123') login(); else alert('密码错误');
      });
    }

    function renderProductList() {
      const tbody = document.getElementById('productTable');
      const countEl = document.getElementById('productCount');
      if (countEl) countEl.textContent = `${products.length} 个商品`;
      if (!tbody) return;
      if (!products.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无商品</td></tr>'; return; }
      tbody.innerHTML = products.map(p => `
        <tr>
          <td>${p.id}</td>
          <td><strong>${escapeHtml(p.name)}</strong></td>
          <td><span class="tag ${p.tag_color || 'tag-gold'}">${p.tag || '-'}</span></td>
          <td>$${p.price}${p.original_price ? ` <s style="color:#666">$${p.original_price}</s>` : ''}</td>
          <td>${p.category}</td>
          <td><span class="status ${p.in_stock ? 'status-in' : 'status-out'}">${p.in_stock ? '有货' : '缺货'}</span></td>
          <td><div class="actions"><button class="btn btn-secondary btn-sm" onclick="openModal(${p.id})">编辑</button><button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">删除</button></div></td>
        </tr>`).join('');
    }

    function renderOrderList() {
      const tbody = document.getElementById('orderTable');
      const countEl = document.getElementById('orderCount');
      if (countEl) countEl.textContent = `${orders.length} 个订单`;
      if (!tbody) return;
      if (!orders || !orders.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无订单</td></tr>'; return; }
      tbody.innerHTML = orders.map(o => `
        <tr>
          <td>#${o.id}</td>
          <td>${escapeHtml(o.name || '-')}</td>
          <td>${escapeHtml(o.email || '-')}</td>
          <td>$${o.total}</td>
          <td><span class="status status-${o.status}">${formatStatus(o.status)}</span></td>
          <td>${o.created_at ? new Date(o.created_at).toLocaleString('zh-CN') : '-'}</td>
          <td><div class="actions"><button class="btn btn-secondary btn-sm" onclick="openOrderModal(${o.id})">查看</button></div></td>
        </tr>`).join('');
    }

    function formatStatus(s) {
      const map = { pending: '待处理', confirmed: '已确认', shipped: '已发货', completed: '已完成', cancelled: '已取消' };
      return map[s] || s;
    }

    async function openOrderModal(id) {
      currentOrder = null;
      const res = await apiFetch(`${ORDERS_API}/${id}`);
      if (!res.ok) { alert('获取订单详情失败'); return; }
      currentOrder = await res.json();
      const modal = document.getElementById('orderModal');
      document.getElementById('orderModalTitle').textContent = `订单 #${currentOrder.id}`;

      let itemsHtml = '';
      let items = [];
      try { items = JSON.parse(currentOrder.items || '[]'); } catch(e) {}
      if (items.length) {
        itemsHtml = items.map(item => `
          <div class="order-item-row">
            <span>${escapeHtml(item.name || item.slug || '商品')} x${item.qty || 1}</span>
            <span>$${item.price || 0}</span>
          </div>`).join('');
      } else {
        itemsHtml = '<div class="order-item-row"><span>-</span></div>';
      }

      let address = [currentOrder.address, currentOrder.city, currentOrder.country, currentOrder.postal_code].filter(Boolean).join(', ') || '-';

      document.getElementById('orderDetailBody').innerHTML = `
        <div class="order-detail-grid">
          <div class="order-detail-item"><label>客户</label><div>${escapeHtml(currentOrder.name || '-')}</div></div>
          <div class="order-detail-item"><label>邮箱</label><div>${escapeHtml(currentOrder.email || '-')}</div></div>
          <div class="order-detail-item"><label>下单时间</label><div>${currentOrder.created_at ? new Date(currentOrder.created_at).toLocaleString('zh-CN') : '-'}</div></div>
          <div class="order-detail-item"><label>订单总额</label><div style="color:#c9a96e;font-weight:600;">$${currentOrder.total}</div></div>
        </div>
        <div class="form-group"><label>收货地址</label><div style="background:#1a1a1a;padding:12px;border-radius:4px;font-size:14px;">${escapeHtml(address)}</div></div>
        <div class="form-group"><label>商品明细</label><div class="order-items">${itemsHtml}<div class="order-total">总计: $${currentOrder.total}</div></div></div>
        <div class="form-group">
          <label>订单状态</label>
          <select id="orderStatusSelect" style="width:auto;min-width:160px;">
            <option value="pending" ${currentOrder.status==='pending'?'selected':''}>待处理</option>
            <option value="confirmed" ${currentOrder.status==='confirmed'?'selected':''}>已确认</option>
            <option value="shipped" ${currentOrder.status==='shipped'?'selected':''}>已发货</option>
            <option value="completed" ${currentOrder.status==='completed'?'selected':''}>已完成</option>
            <option value="cancelled" ${currentOrder.status==='cancelled'?'selected':''}>已取消</option>
          </select>
        </div>

    async function saveOrderStatus() {
      if (!currentOrder) return;
      const status = document.getElementById('orderStatusSelect').value;
      const notes = document.getElementById('orderNotes').value;
      const tracking_number = document.getElementById('orderTracking').value;
      const res = await apiFetch(`${ORDERS_API}/${currentOrder.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status, notes, tracking_number })
      });
      if (res.ok) {
        closeModal();
        await fetchOrders();
      } else {
        const err = await res.json();
        alert('更新失败: ' + (err.error || '未知错误'));
      }
    }

    function setOrderFilter(status) {
      orderStatusFilter = status;
      fetchOrders();
    }

    async function savePaymentConfig() {
      const config = {

          enabled: document.getElementById('paypalEnabled').classList.contains('active'),
          email: document.getElementById('paypalEmail').value,
        },
        wise: {
          enabled: document.getElementById('wiseEnabled').classList.contains('active'),
          account: document.getElementById('wiseAccount').value,
        },
        bankTransfer: {
          enabled: document.getElementById('bankEnabled').classList.contains('active'),
          bankName: document.getElementById('bankName').value,
          accountName: document.getElementById('bankAccountName').value,
          accountNumber: document.getElementById('bankAccountNumber').value,

    async function saveShippingConfig() {
      const rows = document.querySelectorAll('.shipping-method-form-row');
      const methods = [];
      rows.forEach(row => {
        const name = row.querySelector('.sm-name').value.trim();
        const baseRate = parseFloat(row.querySelector('.sm-rate').value) || 0;
        const freeThreshold = parseFloat(row.querySelector('.sm-free').value) || 0;
        if (name) methods.push({ name, baseRate, freeThreshold });
      });
      const config = {
        methods,
        processingDays: document.getElementById('processingDays').value,
        defaultCountry: document.getElementById('defaultCountry').value,
      };
      if (await saveSettings({ shipping_config: JSON.stringify(config) })) {
        alert('物流配置已保存');
      }
    }

    async function saveDeployConfig() {
      const url = document.getElementById('deployHookUrl').value.trim();
      if (await saveSettings({ deploy_hook_url: url })) {
        alert('发布配置已保存');
      }
    }

    async function triggerDeploy() {
      const btn = document.getElementById('deployBtn');
      const status = document.getElementById('deployStatus');
      btn.disabled = true;
      status.textContent = '发布中...';
      try {
        const res = await apiFetch('/api/deploy', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          status.textContent = data.message;
          status.style.color = '#86efac';
        } else {
          status.textContent = data.error + ': ' + data.message;
          status.style.color = '#fca5a5';
        }
      } catch (err) {
        status.textContent = '请求失败: ' + err.message;
        status.style.color = '#fca5a5';
      }
      btn.disabled = false;
    }

    function render() { if (isLoggedIn()) renderDashboard(); else renderLogin(); }
    function escapeHtml(str) { if (!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
    render();
  </script>
